[pytest]
# Pytest configuration for Foot Traffic Analysis Tool

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-config=.coveragerc
    --ignore=venv
    --ignore=env
    --ignore=.venv
    --ignore=cache
    --ignore=analyses_new
    --ignore=reports

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full workflows
    slow: Tests that take longer to run
    api: API endpoint tests
    pdf: PDF generation tests
    osm: OSM data extraction tests

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */env/*
    */.venv/*
    */cache/*
    */analyses_new/*
    */reports/*
    setup.py
    */scripts/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
