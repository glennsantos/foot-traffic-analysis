services:
  web:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "1010:1010"
    volumes:
      - .:/app
      - ./analyses_new:/app/analyses_new
      - ./cache:/app/cache
      - ./reports:/app/reports
    environment:
      - PORT=1010
      # Set a contact email for better Nominatim reliability
      - NOMINATIM_EMAIL=${NOMINATIM_EMAIL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      # Optional: pin a specific Overpass endpoint or provide a list
      - OVERPASS_URL=${OVERPASS_URL:-}
      - OVERPASS_ENDPOINTS=${OVERPASS_ENDPOINTS:-}
      # Allow tuning Gunicorn timeouts if needed (seconds)
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    restart: unless-stopped
    
