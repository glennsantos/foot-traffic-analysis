version: '3.8'

services:
  web:
    build: .
    ports:
      - "1010:1010"
    volumes:
      - .:/app
      - ./analyses:/app/analyses
      - ./cache:/app/cache
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=1010
    user: "${UID}:${GID}"
    working_dir: /app
    restart: unless-stopped
    
