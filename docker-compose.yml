version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "1010:1010"
    volumes:
      - .:/app
      - ./analyses:/app/analyses
      - ./cache:/app/cache
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=1010
    user: "${UID}:${GID}"
    working_dir: /app
    restart: unless-stopped
    extra_hosts:
      - "overpass.kumi.systems:104.200.152.65"
      - "overpass-api.de:176.28.50.165"
    
