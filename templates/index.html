<!DOCTYPE html>
<html>
<head>
    <title>Foot Traffic Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            display: flex;
            gap: 20px;
        }
        .map-container {
            flex: 1;
            min-width: 0;
        }
        .results-container {
            flex: 1;
            min-width: 0;
            padding: 0 20px;
        }
        #map {
            height: 700px;
            width: 100%;
            border-radius: 5px;
        }
        .results {
            display: none;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 5px;
            height: 700px;
            overflow-y: auto;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .error {
            color: red;
            display: none;
            margin: 20px 0;
        }
        .indicators-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .indicators-table th, .indicators-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .indicators-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        .indicators-table tr:hover {
            background-color: #f1f1f1;
        }
        .location-info {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .indicator-description {
            color: #666;
            font-size: 0.9em;
        }
        .instruction-text {
            color: #555;
            font-style: italic;
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            border-radius: 3px;
        }
        .meets-criteria {
            color: #28a745;
            font-weight: bold;
            margin-left: 10px;
        }
        .meets-criteria.fail {
            color: #dc3545;
        }
        .criteria-note {
            color: #6c757d;
            font-size: 0.8em;
            margin-top: 5px;
            font-style: italic;
        }
        .places-list {
            margin-top: 10px;
            padding-left: 20px;
            display: none;
        }
        .places-list li {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .show-places {
            color: #007bff;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.9em;
        }
        .show-places:hover {
            text-decoration: underline;
        }
        .street-name {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }
        .save-info {
            margin-top: 10px;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 5px;
            color: #155724;
            display: none;
        }
        .save-info code {
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .viability-summary {
            margin-top: 15px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 5px;
            border-left: 4px solid #2196f3;
        }
        .viability-score {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .viability-score.excellent {
            color: #4caf50;
        }
        .viability-score.good {
            color: #2196f3;
        }
        .viability-score.moderate {
            color: #ff9800;
        }
        .viability-score.poor {
            color: #f44336;
        }
        .pdf-download {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .download-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 5px;
        }
        .download-btn:hover {
            background-color: #c82333;
            text-decoration: none;
            color: white;
        }
        .radius-control {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .radius-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .radius-control input {
            width: 100px;
            padding: 5px;
            margin-right: 10px;
        }
        .radius-display {
            color: #666;
            font-style: italic;
        }
        .search-container {
            margin-bottom: 15px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .search-results {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: calc(100% - 30px);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
        .search-result-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }
        .search-result-item:hover {
            background-color: #f5f5f5;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item .address-main {
            font-weight: bold;
            margin-bottom: 2px;
        }
        .search-result-item .address-details {
            font-size: 0.9em;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="map-container">
            <h2>Interactive Map</h2>
            <div class="search-container">
                <input type="text" id="search-box" class="search-box" placeholder="Search for a location...">
                <div id="search-results" class="search-results"></div>
            </div>
            <div class="radius-control">
                <label for="radius">Analysis Radius (meters):</label>
                <input type="number" id="radius" value="300" min="100" max="2000" step="100">
                <span class="radius-display">Default: 300m</span>
            </div>
            <div id="map"></div>
        </div>
        <div class="results-container">
            <div class="loading">Analyzing location... Please wait.</div>
            <div class="error"></div>
            <div class="results">
                <div class="location-info">
                    <h3>Location Analysis</h3>
                    <p>Coordinates: <span id="lat"></span>, <span id="lng"></span></p>
                    <p class="street-name">Location: <span id="location-name">Loading...</span></p>
                    <p class="radius-display">Analysis Radius: <span id="analysis-radius">300</span> meters</p>
                    <div class="viability-summary" id="viability-summary" style="display: none;">
                        <div class="viability-score" id="viability-score"></div>
                        <div id="viability-details"></div>
                    </div>
                    <div class="pdf-download" id="pdf-download" style="display: none;">
                        <strong>📄 Detailed Report:</strong><br/>
                        <a href="#" id="pdf-download-link" class="download-btn">Download PDF Report</a>
                        <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                            Complete viability analysis with recommendations
                        </div>
                    </div>
                    <div class="save-info" id="save-info">
                        Analysis saved to: <code id="saved-file"></code>
                    </div>
                </div>
                <table class="indicators-table">
                    <thead>
                        <tr>
                            <th>Indicator</th>
                            <th>Count</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="indicators-body">
                    </tbody>
                </table>
            </div>
        </div>

        <script>
            // Initialize the map with a default view (will be updated after loading last search)
            const map = L.map('map').setView([14.5995, 120.9842], 13); // Default to Manila
            
            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: 'OpenStreetMap contributors'
            }).addTo(map);
            
            // Initialize map click handler
            function setupMapClickHandler() {
                map.on('click', function(e) {
                    const lat = e.latlng.lat;
                    const lng = e.latlng.lng;
                    
                    // Update or create marker
                    if (marker) {
                        marker.setLatLng(e.latlng);
                    } else {
                        marker = L.marker(e.latlng).addTo(map);
                        
                        // Add click handler to marker for analysis
                        marker.on('click', function() {
                            if (confirm('Start analysis for this location?')) {
                                analyzeLocation(lat, lng);
                            }
                        });
                    }
                    
                    // Update marker position for analysis
                    marker._analysisLat = lat;
                    marker._analysisLng = lng;
                    
                    // Show instruction to click marker for analysis
                    showAnalysisInstruction();
                });
            }
            
            // Load last searched location if available
            async function loadLastSearch() {
                try {
                    const response = await fetch('/api/last-search');
                    const data = await response.json();
                    
                    if (data.success) {
                        const { lat, lon, radius } = data;
                        // Update the map view
                        map.setView([lat, lon], 15);
                        // Update the radius input
                        document.getElementById('radius').value = radius;
                        
                        // Add marker for last searched location
                        if (marker) {
                            marker.setLatLng([lat, lon]);
                            // Update click handler with new coordinates
                            marker.off('click');
                            marker.on('click', function() {
                                if (confirm('Start analysis for this location?')) {
                                    analyzeLocation(lat, lon);
                                }
                            });
                        } else {
                            marker = L.marker([lat, lon]).addTo(map);
                            
                            // Add click handler to marker for analysis
                            marker.on('click', function() {
                                if (confirm('Start analysis for this location?')) {
                                    analyzeLocation(lat, lon);
                                }
                            });
                        }
                        
                        // Update marker position for analysis
                        marker._analysisLat = lat;
                        marker._analysisLng = lon;
                        
                        // Show instruction to click marker for analysis
                        showAnalysisInstruction();
                    }
                } catch (error) {
                    console.error('Error loading last search:', error);
                }
            }
            
            // Call setup functions when the page loads
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelector('.loading').style.display = 'none';
                setupMapClickHandler();
                setupSearch();
                loadLastSearch();
            });

            // Setup search functionality
            function setupSearch() {
                const searchBox = document.getElementById('search-box');
                const searchResults = document.getElementById('search-results');
                let searchTimeout;

                searchBox.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    const query = e.target.value.trim();
                    
                    if (query.length < 3) {
                        searchResults.style.display = 'none';
                        return;
                    }

                    searchTimeout = setTimeout(async () => {
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                            const results = await response.json();
                            
                            searchResults.innerHTML = '';
                            
                            if (results.length === 0) {
                                const noResults = document.createElement('div');
                                noResults.className = 'search-result-item';
                                noResults.textContent = 'No results found';
                                searchResults.appendChild(noResults);
                            } else {
                                results.forEach(result => {
                                    const item = document.createElement('div');
                                    item.className = 'search-result-item';
                                    
                                    // Create a container for the result
                                    const container = document.createElement('div');
                                    
                                    // Add the main address (first part of display name)
                                    const mainText = document.createElement('div');
                                    mainText.textContent = result.display_name.split(',')[0];
                                    mainText.className = 'address-main';
                                    container.appendChild(mainText);
                                    
                                    // Add the full address (rest of the display name)
                                    const fullAddress = document.createElement('div');
                                    fullAddress.textContent = result.display_name.split(',').slice(1).join(',').trim();
                                    fullAddress.className = 'address-details';
                                    container.appendChild(fullAddress);
                                    
                                    item.appendChild(container);
                                    
                                    item.addEventListener('click', () => {
                                        searchBox.value = result.display_name;
                                        searchResults.style.display = 'none';
                                        
                                        // Update map view
                                        map.setView([result.lat, result.lon], 16);
                                        
                                        const lat = parseFloat(result.lat);
                                        const lng = parseFloat(result.lon);
                                        
                                        // Add marker
                                        if (marker) {
                                            marker.setLatLng([lat, lng]);
                                            // Update click handler with new coordinates
                                            marker.off('click');
                                            marker.on('click', function() {
                                                if (confirm('Start analysis for this location?')) {
                                                    analyzeLocation(lat, lng);
                                                }
                                            });
                                        } else {
                                            marker = L.marker([lat, lng]).addTo(map);
                                            
                                            // Add click handler to marker for analysis
                                            marker.on('click', function() {
                                                if (confirm('Start analysis for this location?')) {
                                                    analyzeLocation(lat, lng);
                                                }
                                            });
                                        }
                                        
                                        // Update marker position for analysis
                                        marker._analysisLat = lat;
                                        marker._analysisLng = lng;
                                        
                                        // Show instruction to click marker for analysis
                                        showAnalysisInstruction();
                                    });
                                    
                                    // Add hover effect
                                    item.addEventListener('mouseover', () => {
                                        item.style.backgroundColor = '#f0f0f0';
                                    });
                                    
                                    item.addEventListener('mouseout', () => {
                                        item.style.backgroundColor = 'white';
                                    });
                                    
                                    searchResults.appendChild(item);
                                });
                            }
                            
                            searchResults.style.display = 'block';
                        } catch (error) {
                            console.error('Search error:', error);
                            searchResults.style.display = 'none';
                        }
                    }, 300);
                });

                // Hide results when clicking outside
                document.addEventListener('click', (e) => {
                    if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) {
                        searchResults.style.display = 'none';
                    }
                });
            }
            
            // Function to show instruction for analysis
            function showAnalysisInstruction() {
                const resultsElement = document.querySelector('.results');
                const loadingElement = document.querySelector('.loading');
                const errorElement = document.querySelector('.error');
                
                // Hide loading and error states
                loadingElement.style.display = 'none';
                errorElement.style.display = 'none';
                
                // Show instruction message
                resultsElement.innerHTML = `
                    <div class="location-info">
                        <h3>Location Pinned</h3>
                        <p>📍 Click on the marker to start analysis</p>
                        <p class="instruction-text">You have pinned a location on the map. Click the red marker to analyze foot traffic indicators for this area. You will be asked to confirm before the analysis begins.</p>
                    </div>
                `;
                resultsElement.style.display = 'block';
            }
            
            // Function to log messages to console and optionally to user
            function logMessage(message, showToUser = false, isError = false) {
                console.log(`[FRONTEND LOG] ${new Date().toISOString()}: ${message}`);
                
                if (showToUser) {
                    const resultsElement = document.querySelector('.results');
                    const logDiv = document.createElement('div');
                    logDiv.style.cssText = `
                        padding: 8px;
                        margin: 5px 0;
                        border-radius: 3px;
                        font-family: monospace;
                        font-size: 12px;
                        ${isError ? 'background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;' : 'background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;'}
                    `;
                    logDiv.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
                    
                    // Insert at the top of results
                    if (resultsElement.firstChild) {
                        resultsElement.insertBefore(logDiv, resultsElement.firstChild);
                    } else {
                        resultsElement.appendChild(logDiv);
                    }
                    resultsElement.style.display = 'block';
                }
            }
            
            // Function to test network connectivity
            async function testNetworkConnectivity() {
                try {
                    logMessage('Testing network connectivity...', true);
                    const response = await fetch('/api/last-search', { 
                        method: 'GET',
                        cache: 'no-cache'
                    });
                    logMessage('✓ Network connectivity OK', true);
                    return true;
                } catch (error) {
                    logMessage('✗ Network connectivity issue detected', true, true);
                    return false;
                }
            }
            
            // Function to analyze a location
            async function analyzeLocation(lat, lng) {
                logMessage(`Starting analysis for coordinates: ${lat}, ${lng}`, true);
                
                // Test network connectivity first
                const networkOk = await testNetworkConnectivity();
                if (!networkOk) {
                    const errorMsg = 'Network connectivity issue. Please check your internet connection and try again.';
                    logMessage(errorMsg, true, true);
                    displayError(new Error(errorMsg));
                    return;
                }
                
                // Use provided coordinates or fall back to marker coordinates
                if (!lat && !lng && marker) {
                    lat = marker._analysisLat;
                    lng = marker._analysisLng;
                    logMessage(`Using marker coordinates: ${lat}, ${lng}`);
                }
                
                if (!lat || !lng) {
                    const errorMsg = 'No location selected for analysis';
                    logMessage(errorMsg, true, true);
                    displayError(new Error(errorMsg));
                    return;
                }
                
                const radius = parseInt(document.getElementById('radius').value) || 500;
                logMessage(`Analysis radius: ${radius}m`, true);
                
                const loadingElement = document.querySelector('.loading');
                const errorElement = document.querySelector('.error');
                const resultsElement = document.querySelector('.results');
                
                // Restore the proper results structure before starting analysis
                resultsElement.innerHTML = `
                    <div class="location-info">
                        <h3>Location Analysis</h3>
                        <p>Coordinates: <span id="lat"></span>, <span id="lng"></span></p>
                        <p class="street-name">Location: <span id="location-name">Loading...</span></p>
                        <p class="radius-display">Analysis Radius: <span id="analysis-radius">300</span> meters</p>
                        <div class="viability-summary" id="viability-summary" style="display: none;">
                            <div class="viability-score" id="viability-score"></div>
                            <div id="viability-details"></div>
                        </div>
                        <div class="pdf-download" id="pdf-download" style="display: none;">
                            <strong>📄 Detailed Report:</strong><br/>
                            <a href="#" id="pdf-download-link" class="download-btn">Download PDF Report</a>
                            <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                                Complete viability analysis with recommendations
                            </div>
                        </div>
                        <div class="save-info" id="save-info" style="display: none;">
                            Analysis saved to: <code id="saved-file"></code>
                        </div>
                    </div>
                    <table class="indicators-table">
                        <thead>
                            <tr>
                                <th>Indicator</th>
                                <th>Count</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="indicators-body">
                        </tbody>
                    </table>
                `;
                
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';
                resultsElement.style.display = 'block';
                
                logMessage('Clearing previous results and showing loading state', true);
                
                try {
                    // Get location name
                    logMessage('Fetching location name from Nominatim...', true);
                    const locationNameElement = document.getElementById('location-name');
                    if (locationNameElement) {
                        locationNameElement.textContent = 'Loading...';
                    }
                    
                    const locationName = await getLocationName(lat, lng);
                    if (locationNameElement) {
                        locationNameElement.textContent = locationName;
                    }
                    logMessage(`Location name: ${locationName}`, true);
                    
                    // Make the API call to analyze the location
                    logMessage('Sending analysis request to backend...', true);
                    logMessage('⚠ This may take 1-3 minutes depending on network conditions', true);
                    const requestBody = {
                        lat: lat,
                        lon: lng,
                        radius: radius
                    };
                    logMessage(`Request body: ${JSON.stringify(requestBody)}`);
                    
                    const response = await fetch('/analyze', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody)
                    });
                    
                    logMessage(`Backend response status: ${response.status} ${response.statusText}`, true);
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        const errorMsg = errorData.error || 'Failed to analyze location';
                        
                        // Check if it's a network-related error
                        if (errorMsg.includes('overpass') || errorMsg.includes('connection') || errorMsg.includes('timeout')) {
                            logMessage('Network/API issue detected. The OpenStreetMap servers may be temporarily unavailable.', true, true);
                            logMessage('Please try again in a few minutes.', true, true);
                        }
                        
                        logMessage(`Backend error: ${errorMsg}`, true, true);
                        throw new Error(errorMsg);
                    }
                    
                    logMessage('Parsing response data...', true);
                    const data = await response.json();
                    logMessage(`Received data keys: ${Object.keys(data).join(', ')}`);
                    
                    logMessage('Analysis completed successfully!', true);
                    displayResults(data);
                    
                } catch (error) {
                    const errorMsg = `Analysis failed: ${error.message}`;
                    logMessage(errorMsg, true, true);
                    
                    // Provide helpful suggestions based on error type
                    if (error.message.includes('overpass') || error.message.includes('connection')) {
                        logMessage('💡 Suggestion: This appears to be a network connectivity issue with OpenStreetMap servers.', true);
                        logMessage('💡 Try again in a few minutes, or check your internet connection.', true);
                    }
                    
                    console.error('Error:', error);
                    displayError(error);
                } finally {
                    loadingElement.style.display = 'none';
                    logMessage('Analysis process finished', true);
                }
            }

            let marker = null;
            let searchTimeout = null;

            const indicatorDescriptions = {
                'restaurants_and_cafes': 'Food establishments including restaurants, cafes, bars, and food courts',
                'schools_universities': 'Educational institutions including schools, universities, and colleges',
                'hospitals_clinics': 'Healthcare facilities including hospitals and clinics',
                'markets': 'Public markets and marketplaces',
                'places_of_worship': 'Religious establishments including churches, mosques, and chapels',
                'tourist_sites': 'Tourist attractions and points of interest including parks and leisure facilities',
                'shops': 'Retail establishments and shopping venues',
                'bus_stops': 'Public transportation stops for buses and jeepneys',
                'pedestrian_crossings': 'Designated pedestrian crossing points and sidewalks',
                'intersection_count': 'Number of road intersections in the area'
            };

            const criteria = {
                'restaurants_and_cafes': { threshold: 4, description: 'Should have ≥ 4 restaurants/cafes' },
                'shops': { threshold: 8, description: 'Should have ≥ 8 shops/retail POIs' },
                'intersection_count': { threshold: 20, description: 'Should have ≥ 20 intersections' },
                'schools_universities': { threshold: 1, description: 'Should have ≥ 1 school or be near a campus' },
                'hospitals_clinics': { threshold: 1, description: 'Should have ≥ 1 clinic or medical facility' },
                'bus_stops': { threshold: 2, description: 'Should have ≥ 2 transit stops' },
                'pedestrian_crossings': { threshold: 3, description: 'Should have ≥ 3 pedestrian features' },
                'markets': { threshold: 1, description: 'Should have ≥ 1 market or mall' },
                'tourist_sites': { threshold: 1, description: 'Should have ≥ 1 tourist/leisure POI' },
                'places_of_worship': { threshold: 1, description: 'Should have ≥ 1 large church/mosque OR ≥ 2 small chapels' }
            };

            function formatIndicatorName(name) {
                return name
                    .split('_')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            function checkCriteria(key, value) {
                if (!criteria[key]) return null;
                
                let count;
                if (typeof value === 'object' && value.count !== undefined) {
                    // Filter out 'nan (nan)' entries when counting
                    if (value.places) {
                        const validPlaces = value.places.filter(place => place !== 'nan (nan)');
                        count = validPlaces.length;
                    } else {
                        count = value.count;
                    }
                } else {
                    count = value;
                }
                
                return count >= criteria[key].threshold;
            }

            async function getLocationName(lat, lng) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
                    const data = await response.json();
                    const road = data.address.road || '';
                    const suburb = data.address.suburb || '';
                    const city = data.address.city || '';
                    return road ? `${road}, ${suburb}, ${city}` : `${suburb}, ${city}`;
                } catch (error) {
                    console.error('Error getting location name:', error);
                    return 'Location name not available';
                }
            }

            function displayResults(data) {
                try {
                    // Update location info safely
                    const latElement = document.getElementById('lat');
                    const lngElement = document.getElementById('lng');
                    const radiusElement = document.getElementById('analysis-radius');
                    
                    if (latElement) latElement.textContent = data.lat.toFixed(4);
                    if (lngElement) lngElement.textContent = data.lon.toFixed(4);
                    if (radiusElement) radiusElement.textContent = data.radius_meters;

                    // Show viability summary if available
                    if (data.viability_score !== undefined && data.viability_rating) {
                        const summaryElement = document.getElementById('viability-summary');
                        const scoreElement = document.getElementById('viability-score');
                        const detailsElement = document.getElementById('viability-details');
                        
                        if (summaryElement && scoreElement && detailsElement) {
                            const rating = data.viability_rating.toLowerCase();
                            const scoreClass = rating === 'excellent' ? 'excellent' : 
                                             rating === 'good' ? 'good' : 
                                             rating === 'moderate' ? 'moderate' : 'poor';
                            
                            scoreElement.textContent = `Viability Score: ${data.viability_score.toFixed(1)}% (${data.viability_rating})`;
                            scoreElement.className = `viability-score ${scoreClass}`;
                            
                            // Show summary details (strip HTML tags for display)
                            if (data.viability_summary) {
                                const summaryText = data.viability_summary.replace(/<[^>]*>/g, '').replace(/&bull;/g, '•');
                                detailsElement.innerHTML = summaryText.replace(/\n/g, '<br/>');
                            }
                            
                            summaryElement.style.display = 'block';
                        }
                    }

                    // Show PDF download if available
                    if (data.pdf_report) {
                        const pdfDownloadElement = document.getElementById('pdf-download');
                        const pdfLinkElement = document.getElementById('pdf-download-link');
                        
                        if (pdfDownloadElement && pdfLinkElement) {
                            pdfLinkElement.href = `/download-report/${data.pdf_report}`;
                            pdfDownloadElement.style.display = 'block';
                        }
                    }

                    // Show save information
                    if (data.saved_file) {
                        const saveInfoElement = document.getElementById('save-info');
                        const savedFileElement = document.getElementById('saved-file');
                        if (saveInfoElement) saveInfoElement.style.display = 'block';
                        if (savedFileElement) savedFileElement.textContent = data.saved_file;
                        delete data.saved_file;
                    }
                    delete data.radius_meters;  // Remove from data before displaying in table
                    delete data.pdf_report;     // Remove from data before displaying in table
                    delete data.viability_score; // Remove from data before displaying in table
                    delete data.viability_rating; // Remove from data before displaying in table
                    delete data.viability_summary; // Remove from data before displaying in table

                    // Clear previous results
                    const tbody = document.getElementById('indicators-body');
                    if (tbody) {
                        tbody.innerHTML = '';

                        // Add rows for each indicator
                        Object.entries(data).forEach(([key, value]) => {
                            if (key !== 'latitude' && key !== 'longitude' && key !== 'saved_file') {
                                const row = tbody.insertRow();
                                const nameCell = row.insertCell(0);
                                const countCell = row.insertCell(1);
                                const descCell = row.insertCell(2);
                                
                                nameCell.textContent = formatIndicatorName(key);
                                
                                if (typeof value === 'object' && value.count !== undefined) {
                                    countCell.textContent = value.count;
                                    
                                    // Add checkmark if meets criteria
                                    const meetsCriteria = checkCriteria(key, value);
                                    if (meetsCriteria !== null) {
                                        const checkmark = document.createElement('span');
                                        checkmark.className = 'meets-criteria' + (meetsCriteria ? '' : ' fail');
                                        checkmark.textContent = meetsCriteria ? '✓' : '✗';
                                        checkmark.title = criteria[key].description;
                                        countCell.appendChild(checkmark);

                                        const criteriaNote = document.createElement('div');
                                        criteriaNote.className = 'criteria-note';
                                        criteriaNote.textContent = criteria[key].description;
                                        countCell.appendChild(criteriaNote);
                                    }
                                    
                                    if (value.places && value.places.length > 0) {
                                        const toggleBtn = document.createElement('span');
                                        toggleBtn.className = 'show-places';
                                        toggleBtn.textContent = 'Show Places';
                                        countCell.appendChild(toggleBtn);

                                        const placesList = document.createElement('ul');
                                        placesList.className = 'places-list';
                                        value.places.forEach(place => {
                                            const li = document.createElement('li');
                                            li.textContent = place;
                                            placesList.appendChild(li);
                                        });
                                        countCell.appendChild(placesList);

                                        toggleBtn.onclick = function() {
                                            const isHidden = placesList.style.display === 'none' || !placesList.style.display;
                                            placesList.style.display = isHidden ? 'block' : 'none';
                                            toggleBtn.textContent = isHidden ? 'Hide Places' : 'Show Places';
                                        };
                                    }
                                } else {
                                    countCell.textContent = value;
                                    // Add checkmark for non-object values (like intersection_count)
                                    const meetsCriteria = checkCriteria(key, value);
                                    if (meetsCriteria !== null) {
                                        const checkmark = document.createElement('span');
                                        checkmark.className = 'meets-criteria' + (meetsCriteria ? '' : ' fail');
                                        checkmark.textContent = meetsCriteria ? '✓' : '✗';
                                        checkmark.title = criteria[key].description;
                                        countCell.appendChild(checkmark);

                                        const criteriaNote = document.createElement('div');
                                        criteriaNote.className = 'criteria-note';
                                        criteriaNote.textContent = criteria[key].description;
                                        countCell.appendChild(criteriaNote);
                                    }
                                }
                                
                                descCell.textContent = indicatorDescriptions[key] || '';
                                descCell.className = 'indicator-description';
                            }
                        });
                    }

                    // Show results
                    const resultsElement = document.querySelector('.results');
                    if (resultsElement) {
                        resultsElement.style.display = 'block';
                    }
                } catch (error) {
                    displayError(error);
                }
            }
        
            // Function to display error
            function displayError(error) {
                const errorElement = document.querySelector('.error');
                errorElement.textContent = 'Error: ' + (error.message || 'An unknown error occurred');
                errorElement.style.display = 'block';
                document.querySelector('.loading').style.display = 'none';
            }
        </script>
    </div>
</body>
</html>
