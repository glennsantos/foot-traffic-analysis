<!DOCTYPE html>
<html>
<head>
    <title>Foot Traffic Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            display: flex;
            gap: 20px;
        }
        .map-container {
            flex: 1;
            min-width: 0;
        }
        .results-container {
            flex: 1;
            min-width: 0;
            padding: 0 20px;
        }
        #map {
            height: 700px;
            width: 100%;
            border-radius: 5px;
        }
        .results {
            display: none;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 5px;
            height: 700px;
            overflow-y: auto;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .error {
            color: red;
            display: none;
            margin: 20px 0;
        }
        .indicators-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .indicators-table th, .indicators-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .indicators-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        .indicators-table tr:hover {
            background-color: #f1f1f1;
        }
        .location-info {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .indicator-description {
            color: #666;
            font-size: 0.9em;
        }
        .street-name {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="map-container">
            <h2>Interactive Map</h2>
            <p>Click anywhere on the map to analyze foot traffic indicators for that location.</p>
            <div id="map"></div>
        </div>
        <div class="results-container">
            <div class="loading">Analyzing location... Please wait.</div>
            <div class="error"></div>
            <div class="results">
                <div class="location-info">
                    <h3>Location Analysis</h3>
                    <p>Coordinates: <span id="lat"></span>, <span id="lng"></span></p>
                    <p class="street-name">Location: <span id="location-name">Loading...</span></p>
                </div>
                <table class="indicators-table">
                    <thead>
                        <tr>
                            <th>Indicator</th>
                            <th>Count</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="indicators-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Initialize the map centered on BGC High Street
        const map = L.map('map').setView([14.5508, 121.0549], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;

        const indicatorDescriptions = {
            'restaurants_and_cafes': 'Food establishments including restaurants, cafes, bars, and food courts',
            'schools_universities': 'Educational institutions including schools, universities, and colleges',
            'hospitals_clinics': 'Healthcare facilities including hospitals and clinics',
            'markets': 'Public markets and marketplaces',
            'places_of_worship': 'Religious establishments and places of worship',
            'tourist_sites': 'Tourist attractions and points of interest',
            'leisure_places': 'Recreation and leisure facilities',
            'shops': 'Retail establishments and shopping venues',
            'bus_stops': 'Public transportation stops for buses',
            'pedestrian_crossings': 'Designated pedestrian crossing points',
            'intersection_count': 'Number of road intersections in the area'
        };

        function formatIndicatorName(name) {
            return name
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        async function getLocationName(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
                const data = await response.json();
                const road = data.address.road || '';
                const suburb = data.address.suburb || '';
                const city = data.address.city || '';
                return road ? `${road}, ${suburb}, ${city}` : `${suburb}, ${city}`;
            } catch (error) {
                console.error('Error getting location name:', error);
                return 'Location name not available';
            }
        }

        // Handle map clicks
        map.on('click', async function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // Update or create marker
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }

            // Show loading state
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.results').style.display = 'none';
            document.querySelector('.error').style.display = 'none';

            try {
                // Get location name
                document.getElementById('location-name').textContent = 'Loading...';
                const locationName = await getLocationName(lat, lng);
                document.getElementById('location-name').textContent = locationName;

                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        lat: lat,
                        lon: lng
                    })
                });

                if (!response.ok) {
                    throw new Error('Analysis failed');
                }

                const data = await response.json();
                
                // Update location info
                document.getElementById('lat').textContent = lat.toFixed(4);
                document.getElementById('lng').textContent = lng.toFixed(4);

                // Clear previous results
                const tbody = document.getElementById('indicators-body');
                tbody.innerHTML = '';

                // Add rows for each indicator
                Object.entries(data).forEach(([key, value]) => {
                    if (key !== 'latitude' && key !== 'longitude') {
                        const row = tbody.insertRow();
                        row.insertCell(0).textContent = formatIndicatorName(key);
                        row.insertCell(1).textContent = value;
                        const descCell = row.insertCell(2);
                        descCell.textContent = indicatorDescriptions[key] || '';
                        descCell.className = 'indicator-description';
                    }
                });

                // Show results
                document.querySelector('.results').style.display = 'block';
            } catch (error) {
                document.querySelector('.error').textContent = 'Error analyzing location: ' + error.message;
                document.querySelector('.error').style.display = 'block';
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
